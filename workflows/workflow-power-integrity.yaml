id: c8f483ec-006e-4971-b7af-fe8b5d1ed01a
name: power-integrity
description: >-
  Cross-behavior integrity check: three independent witnesses to the same
  underlying power problem. Two come from @aaronge/rpi-health: the sticky
  under-voltage fault bit and the PMIC supply-rail voltage. The third is
  the NVMe drive's unsafe_shutdowns counter from @aaronge/nvme-health,
  most directly relevant given a 4.6W drive on a ~5W-budget PCIe slot.
  That witness reads nvme-local's latest smart data, written every 15
  minutes by @aaronge/nvme-health. It doesn't call readSmart itself, since
  deltas are per reading and a second reader would hide increments from
  that workflow. A new unsafe shutdown therefore fails this check for up
  to 15 minutes. Scheduled every 5 minutes, matching @aaronge/rpi-health's
  own cadence.
version: 1
tags: {}
trigger:
  schedule: "*/5 * * * *"
inputs:
  properties:
    minSupplyVolts:
      type: number
      default: 4.8
      description: >-
        EXT5V_V floor before concern. Matches @aaronge/rpi-health's
        minSupplyVolts default.
jobs:
  - name: collect
    description: Read throttle and PMIC state in parallel.
    dependsOn: []
    steps:
      - name: readThrottle
        task:
          type: behavior
          behavior: health-local
          methodName: readThrottle
        dependsOn: []
      - name: readPmic
        task:
          type: behavior
          behavior: health-local
          methodName: readPmic
        dependsOn: []

  - name: assert
    description: >-
      Fail the run when any power witness looks bad. Separate assert steps
      rather than one combined expression, so the report distinguishes
      which witness actually fired.
    dependsOn:
      - job: collect
        condition:
          type: completed
    steps:
      - name: no-under-voltage-since-boot
        allowFailure: false
        task:
          type: assert
          expr: >-
            data.latest("health-local", "throttle").attributes.sinceBoot.underVoltage
            == false
          message: >-
            Sticky under-voltage fault latched since boot (raw=${{ data.latest("health-local", "throttle").attributes.raw }}) —
            a brownout happened at some point, even if the supply reads
            fine right now. Stays red until reboot; that's correct, not a bug.
          severity: high
        dependsOn: []
      - name: supply-volts-ok
        allowFailure: false
        task:
          type: assert
          expr: >-
            data.latest("health-local", "pmic").attributes.supplyVolts
            > inputs.minSupplyVolts
          message: >-
            supplyVolts=${{ data.latest("health-local", "pmic").attributes.supplyVolts }}V
            <= minSupplyVolts=${{ inputs.minSupplyVolts }}V.
          severity: high
        dependsOn: []
      - name: no-new-nvme-unsafe-shutdowns
        allowFailure: false
        task:
          type: assert
          expr: >-
            data.latest("nvme-local", "smart").attributes.deltas.unsafeShutdowns == null
            || data.latest("nvme-local", "smart").attributes.deltas.unsafeShutdowns == 0
          message: >-
            The NVMe drive recorded ${{ data.latest("nvme-local", "smart").attributes.deltas.unsafeShutdowns }}
            new unsafe shutdown(s) in its latest reading (lifetime
            ${{ data.latest("nvme-local", "smart").attributes.counters.unsafeShutdowns }}):
            it lost power without a clean shutdown.
          severity: high
        dependsOn: []

  - name: report
    description: >-
      Print a one-screen summary. Depends on collect only (not assert), so
      it still runs when an assertion fails.
    dependsOn:
      - job: collect
        condition:
          type: completed
    steps:
      - name: summarize
        task:
          type: behavior
          behaviorType: "command/shell"
          behaviorName: power-integrity-summary
          methodName: execute
          inputs:
            run: >-
              echo "power-integrity" &&
              echo "  throttle raw: ${{ data.latest('health-local', 'throttle').attributes.raw }} (sinceBoot.underVoltage=${{ data.latest('health-local', 'throttle').attributes.sinceBoot.underVoltage }})" &&
              echo "  supplyVolts: ${{ data.latest('health-local', 'pmic').attributes.supplyVolts }}V (threshold ${{ inputs.minSupplyVolts }}V)" &&
              echo "  NVMe unsafe shutdowns: ${{ data.latest('nvme-local', 'smart').attributes.counters.unsafeShutdowns }} lifetime, ${{ data.latest('nvme-local', 'smart').attributes.deltas.unsafeShutdowns }} new in latest reading"
        dependsOn: []
