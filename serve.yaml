# The Pi's single ops serve, loaded via --config serve.yaml (kept out of
# .swamp/ so it is version-controlled). See docs/swamp-ops-best-practices.md.
port: 9090
host: "127.0.0.1"
# One scheduled workflow at a time keeps the 4-core Pi responsive; raise
# only if /api/v1/health shows oldestQueuedAt growing.
max-concurrent-scheduled-runs: 1
# A hung run is aborted instead of holding memory for an hour.
max-run-duration: "15m"
hot-reload: true
# Per-workflow overrides for pulled packages (documented `triggers:` block;
# `swamp workflow trigger set` can't express array inputs).
triggers:
  # The swamp-workflow-* timers fleet-health used to watch were retired when
  # this serve took over scheduling, so it watches the serve itself. Its
  # .prom freshness and Loki error checks are unchanged.
  "@aaronge/fleet-health":
    schedule: "8,18,28,38,48,58 * * * *"
    inputs:
      units:
        - unit-swamp-serve
      gatedUnits:
        - unit-swamp-serve
