# The Pi's single ops serve, loaded via --config serve.yaml (kept out of
# .swamp/ so it is version-controlled). See docs/swamp-ops-best-practices.md.
port: 9090
host: "127.0.0.1"
# One scheduled workflow at a time keeps the 4-core Pi responsive; raise
# only if /api/v1/health shows oldestQueuedAt growing.
max-concurrent-scheduled-runs: 1
# A hung run is aborted instead of holding memory for an hour.
max-run-duration: "15m"
hot-reload: true
# Per-workflow schedule/input overrides for pulled packages (documented in
# docs/swamp-ops-best-practices.md). Each entry replaces that workflow's
# built-in trigger, so restate its schedule.
triggers:
  # No RTC coin cell is fitted on this Pi: the J5 battery input reads about
  # 0.008 V. lowBatteryVolts=0 turns off only the battery assert. The drift
  # check against NTP still runs, and rpi_rtc_battery_volts is still
  # exported. Remove this entry if a battery is ever fitted.
  "@aaronge/rpi-rtc":
    schedule: "*/5 * * * *"
    inputs:
      lowBatteryVolts: 0
